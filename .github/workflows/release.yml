name: Release

# Runs when a version tag is pushed. Obsidian requires the tag to exactly
# match manifest.json's version with no "v" prefix, e.g. 1.0.0
on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            # Needed to create the GitHub release
            contents: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci

            - name: Check the tag matches the manifest and package versions
              run: |
                  tag="${GITHUB_REF_NAME}"
                  manifest_version=$(node -p "require('./manifest.json').version")
                  package_version=$(node -p "require('./package.json').version")
                  if [ "$tag" != "$manifest_version" ] || [ "$tag" != "$package_version" ]; then
                      echo "Tag $tag does not match manifest.json ($manifest_version) and package.json ($package_version)"
                      exit 1
                  fi

            - run: npm run lint
            - run: npm test
            - run: npm run build

            # Created as a draft so the release notes can be reviewed before
            # publishing. Obsidian only sees the release once it's published
            - name: Create draft GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                      --title "$GITHUB_REF_NAME" \
                      --draft \
                      --generate-notes \
                      main.js manifest.json styles.css
